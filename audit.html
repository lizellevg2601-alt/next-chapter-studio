<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Life Audit — The Next Chapter Life Audit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css?v=7">
  <link rel="stylesheet" href="/audit-styles.css">
  <link rel="icon" type="image/png" href="/assets/compass.png">

  <script src="/audit-config.js"></script>
</head>
<body class="audit-page">

  <!-- Header -->
  <header class="header">
    <div class="container header-inner">
      <a href="/" class="logo">
        <img src="/assets/logo.png" alt="Next Chapter Studio" class="logo-img">
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/#workbook">Workbook</a>
        <a href="/#events">Events</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="audit-container audit-section" id="app">
      <!-- Views are rendered here by JavaScript -->
    </div>
  </main>

  <script>
    (function () {
      'use strict';

      /* ============================
         STATE
         ============================ */
      const STORAGE_KEY = 'ncla_state';

      const defaultState = {
        step: 'landing',
        answers: {},
        priorityAreas: [],
        whatBroughtYou: null,
        whatBroughtYouOther: '',
        email: '',
        scored: false,
        results: null,
        startedAt: null,
        completedAt: null,
        lastQuestionIndex: 0,
        questionOrder: [],
        sessionId: null,
      };

      let state;



      function loadState() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) {
            const parsed = JSON.parse(saved);
            state = { ...defaultState, ...parsed };
            return;
          }
        } catch (e) { /* ignore */ }
        state = { ...defaultState };
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) { /* ignore */ }
      }

      function resetState() {
        state = { ...defaultState };
        saveState();
      }

      /* ============================
         ANALYTICS EVENTS
         ============================ */
      function trackEvent(eventName, data) {
        const enabled = AUDIT_CONFIG.analyticsEvents;
        const name = Object.values(enabled).includes(eventName) ? eventName : eventName;

        if (typeof window.lintrk === 'function') {
          try { window.lintrk('track', { conversion_id: null }); } catch (e) { /* ignore */ }
        }

        if (typeof gtag === 'function') {
          try { gtag('event', name, data || {}); } catch (e) { /* ignore */ }
        }

        console.log('[Audit Event]', name, data || '');
      }

      /* ============================
         VIEW HELPERS
         ============================ */
      function $(id) { return document.getElementById(id); }

      const appEl = document.getElementById('app');

      function render(html) {
        appEl.innerHTML = html;
      }

      function scrollToTop() {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      /* ============================
         SHUFFLE questions so order is randomised per session
         ============================ */
      function shuffleArray(arr) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled;
      }

      function initQuestionOrder() {
        if (state.questionOrder && state.questionOrder.length === AUDIT_CONFIG.questions.length) {
          return;
        }
        state.questionOrder = shuffleArray(AUDIT_CONFIG.questions.map(q => q.id));
        saveState();
      }

      function getCurrentQuestion() {
        if (!state.questionOrder.length) initQuestionOrder();
        const idx = state.lastQuestionIndex;
        const qId = state.questionOrder[idx];
        if (!qId) return null;
        return AUDIT_CONFIG.questions.find(q => q.id === qId);
      }

      /* ============================
         SCORING ENGINE
         ============================ */
      function calculateResults() {
        const catScores = {};
        AUDIT_CONFIG.categories.forEach(cat => {
          const catQuestions = AUDIT_CONFIG.questions.filter(q => q.category === cat.id);
          const total = catQuestions.reduce((sum, q) => {
            const val = parseInt(state.answers[q.id], 10);
            return sum + (isNaN(val) ? 0 : val);
          }, 0);
          const avg = total / catQuestions.length;
          const percent = ((avg - 1) / 9) * 100;
          catScores[cat.id] = {
            score: Math.round(avg * 10) / 10,
            percent: Math.round(percent),
            raw: avg,
          };
        });

        const allAnswers = Object.values(state.answers).map(v => parseInt(v, 10)).filter(v => !isNaN(v));
        const overallRaw = allAnswers.reduce((a, b) => a + b, 0) / allAnswers.length;
        const overallPercent = Math.round(((overallRaw - 1) / 9) * 100);

        let chapter = AUDIT_CONFIG.chapters.find(c => overallPercent >= c.minPercent && overallPercent <= c.maxPercent);
        if (!chapter) chapter = AUDIT_CONFIG.chapters[AUDIT_CONFIG.chapters.length - 1];

        const sorted = Object.entries(catScores).sort((a, b) => b[1].score - a[1].score);
        const strongest = sorted[0];
        const weakest = sorted[sorted.length - 1];

        const pattern = detectPattern(catScores);

        return {
          categoryScores: catScores,
          overallRaw: Math.round(overallRaw * 10) / 10,
          overallPercent,
          chapter,
          strongest: { category: strongest[0], score: strongest[1] },
          weakest: { category: weakest[0], score: weakest[1] },
          pattern,
        };
      }

      function detectPattern(catScores) {
        const scores = Object.values(catScores).map(c => c.score);
        const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
        const max = Math.max(...scores);
        const min = Math.min(...scores);
        const variance = max - min;
        const belowMid = scores.filter(s => s < 5).length;

        if (belowMid >= 4) {
          const lowCats = ['fun-recreation', 'health', 'personal-growth', 'purpose-fulfilment'];
          const hasLowRec = lowCats.some(c => (catScores[c]?.score || 10) < 5);
          if (hasLowRec) return AUDIT_CONFIG.patterns.find(p => p.id === 'reconnection');
        }

        if (variance >= 4) {
          return AUDIT_CONFIG.patterns.find(p => p.id === 'pulled-directions');
        }

        if (avg >= 6 && variance <= 3) {
          return AUDIT_CONFIG.patterns.find(p => p.id === 'momentum');
        }

        if (avg >= 6 && variance >= 2.5) {
          return AUDIT_CONFIG.patterns.find(p => p.id === 'strong-foundation');
        }

        if (belowMid >= 3) {
          return AUDIT_CONFIG.patterns.find(p => p.id === 'reconnection');
        }

        return AUDIT_CONFIG.patterns.find(p => p.id === 'pulled-directions');
      }

      function getCategoryInterpretation(catId, score) {
        const interps = AUDIT_CONFIG.categoryInterpretations[catId];
        if (!interps) return '';
        if (score >= 7) return interps.high;
        if (score >= 4) return interps.moderate;
        return interps.low;
      }

      function getBarClass(score) {
        if (score >= 7) return 'high';
        if (score >= 4) return 'moderate';
        return 'low';
      }

      function getWorkbookRecommendations(catIds) {
        const all = [];
        catIds.forEach(catId => {
          const recs = AUDIT_CONFIG.workbookRecommendations[catId];
          if (recs) recs.forEach(r => { if (!all.includes(r)) all.push(r); });
        });
        return all;
      }


      /* ============================
         VIEW: LANDING
         ============================ */
      function renderLanding() {
        trackEvent(AUDIT_CONFIG.analyticsEvents.pageViewed);
        render(`
          <div class="audit-landing">
            <span class="label-pill">FREE ASSESSMENT</span>
            <h1>Where are you today?</h1>
            <p class="audit-subtitle">Take the free Next Chapter Life Audit and discover what feels strong, what needs attention and where your next chapter may begin.</p>
            <p class="audit-meta">${AUDIT_CONFIG.totalQuestions} thoughtful questions. Approximately five minutes.</p>
            <button class="btn btn-primary btn-large" onclick="auditApp.start()">Start My Free Life Audit</button>
            <p class="audit-privacy-note">Your answers are private and stored only on your device.</p>
          </div>
        `);
      }

      /* ============================
         VIEW: QUESTIONS
         ============================ */
      function renderQuestion() {
        const q = getCurrentQuestion();
        if (!q) {
          renderPersonalisation();
          return;
        }

        const idx = state.lastQuestionIndex;
        const total = AUDIT_CONFIG.questions.length;
        const progress = ((idx) / total) * 100;
        const cat = AUDIT_CONFIG.categories.find(c => c.id === q.category);
        const selected = state.answers[q.id];
        const hasPrev = idx > 0;
        const isLast = idx === total - 1;
        const canContinue = selected !== undefined && selected !== null;

        let ratingHTML = '';
        for (let i = AUDIT_CONFIG.scaleMin; i <= AUDIT_CONFIG.scaleMax; i++) {
          ratingHTML += `<button class="audit-rating-btn${selected == i ? ' selected' : ''}" data-value="${i}" onclick="auditApp.rate(${i}, event)" aria-label="${i}">${i}</button>`;
        }

        const categoryLabel = cat ? cat.label : '';

        render(`
          <div>
            <div class="audit-progress">
              <div class="audit-progress-bar">
                <div class="audit-progress-fill" style="width:${progress}%"></div>
              </div>
              <span class="audit-progress-text">${idx + 1} of ${total}</span>
            </div>

            <div class="audit-question-card" role="region" aria-label="Question ${idx + 1}">
              <div class="audit-question-category">${categoryLabel}</div>
              <div class="audit-question-number">Question ${idx + 1} of ${total}</div>
              <p class="audit-question-text">${q.text}</p>

              <div class="audit-rating">
                <div class="audit-rating-labels">
                  <span>${AUDIT_CONFIG.scaleLabels.low}</span>
                  <span>${AUDIT_CONFIG.scaleLabels.high}</span>
                </div>
                <div class="audit-rating-grid" role="radiogroup" aria-label="Rate from 1 to 10">
                  ${ratingHTML}
                </div>
              </div>

              <div class="audit-nav">
                <button class="btn btn-outline" onclick="auditApp.prev()" ${!hasPrev ? 'disabled' : ''}>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="15 18 9 12 15 6"/></svg>
                  Back
                </button>
                <div></div>
              </div>
            </div>
          </div>
        `);

        if (selected) {
          const btn = document.querySelector(`.audit-rating-btn[data-value="${selected}"]`);
          if (btn) btn.focus();
        }
      }

      /* ============================
         VIEW: PERSONALISATION
         ============================ */
      function renderPersonalisation() {
        const pq = AUDIT_CONFIG.personalisationQuestions;
        const total = AUDIT_CONFIG.questions.length;
        const progress = 100;

        render(`
          <div>
            <div class="audit-progress">
              <div class="audit-progress-bar">
                <div class="audit-progress-fill" style="width:${progress}%"></div>
              </div>
              <span class="audit-progress-text">${total + 1} of ${total + 2}</span>
            </div>

            <div class="audit-personalisation">
              <div id="audit-pq-0"></div>
              <div id="audit-pq-1" style="display:none"></div>
            </div>
          </div>
        `);

        renderPersonalisationQuestion(0);
      }

      function renderPersonalisationQuestion(idx) {
        const pq = AUDIT_CONFIG.personalisationQuestions[idx];
        if (!pq) {
          renderEmailCapture();
          return;
        }

        const container = document.getElementById(`audit-pq-${idx}`);
        if (!container) return;

        if (pq.type === 'select-multiple') {
          let optionsHTML = '';
          pq.options.forEach(opt => {
            const selected = state.priorityAreas.includes(opt);
            optionsHTML += `<button class="audit-option-btn${selected ? ' selected' : ''}" data-value="${opt}" onclick="auditApp.togglePriority('${opt}')">${opt}</button>`;
          });

          container.style.display = 'block';
          container.innerHTML = `
            <h2>${pq.text}</h2>
            <p class="audit-question-sub">Select exactly ${pq.maxSelections}</p>
            <div class="audit-option-grid">
              ${optionsHTML}
            </div>
            <div class="audit-nav">
              <button class="btn btn-outline" onclick="auditApp.goBackFromPersonalisation()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="15 18 9 12 15 6"/></svg>
                Back
              </button>
              <button class="btn btn-primary" onclick="auditApp.nextPersonalisation()" ${state.priorityAreas.length !== pq.maxSelections ? 'disabled' : ''}>
                Continue
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          `;
        } else if (pq.type === 'select-one') {
          let optionsHTML = '';
          pq.options.forEach(opt => {
            const selected = state.whatBroughtYou === opt.value;
            optionsHTML += `<button class="audit-option-btn${selected ? ' radio-selected' : ''}" data-value="${opt.value}" onclick="auditApp.selectWhatBroughtYou('${opt.value}')">${opt.label}</button>`;
          });

          const showOther = state.whatBroughtYou === 'other';
          container.style.display = 'block';
          container.innerHTML = `
            <h2>${pq.text}</h2>
            <p class="audit-question-sub">Choose one</p>
            <div class="audit-option-grid" style="grid-template-columns:1fr">
              ${optionsHTML}
            </div>
            ${showOther ? `
              <div class="audit-other-field">
                <input type="text" placeholder="Tell us more..." value="${auditApp.escapeHtml(state.whatBroughtYouOther)}" oninput="auditApp.setWhatBroughtYouOther(this.value)" />
              </div>
            ` : ''}
            <div class="audit-nav">
              <button class="btn btn-outline" onclick="auditApp.goBackFromPersonalisation(1)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="15 18 9 12 15 6"/></svg>
                Back
              </button>
              <button class="btn btn-primary" onclick="auditApp.nextPersonalisation()" ${!state.whatBroughtYou ? 'disabled' : ''}>
                Continue
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-left:6px"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>
          `;
        }
      }

      /* ============================
         VIEW: EMAIL CAPTURE
         ============================ */
      function renderEmailCapture() {
        render(`
          <div class="audit-email-section">
            <h2>Your Life Audit is Ready</h2>
            <p class="audit-question-sub">Enter your email to receive your full results and save your assessment for later.</p>

            <div class="audit-email-field">
              <input type="email" id="audit-email-input" placeholder="Your email address (optional)" value="${auditApp.escapeHtml(state.email)}" oninput="auditApp.setEmail(this.value)" />
            </div>



            <button class="btn btn-primary btn-large" onclick="auditApp.complete()">See My Results</button>
            <a class="audit-skip-link" onclick="auditApp.complete()">Skip, show my results</a>

            <div class="audit-nav" style="justify-content:flex-start;margin-top:32px;">
              <button class="btn btn-outline" onclick="auditApp.goBackToPersonalisation()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="15 18 9 12 15 6"/></svg>
                Back
              </button>
            </div>
          </div>
        `);

        const emailInput = document.getElementById('audit-email-input');
        if (emailInput && !state.email) {
          setTimeout(() => emailInput.focus(), 300);
        }
      }

      /* ============================
         VIEW: RESULTS
         ============================ */
      function renderResults() {
        if (!state.results) return;
        const r = state.results;
        const chapter = r.chapter;
        const pattern = r.pattern;

        const catLabels = AUDIT_CONFIG.categories.map(c => c.label);
        const catScores = AUDIT_CONFIG.categories.map(c => r.categoryScores[c.id]?.score || 0);

        trackEvent(AUDIT_CONFIG.analyticsEvents.resultsViewed);

        render(`
          <div class="audit-results">
            <!-- Header -->
            <div class="audit-results-header">
              <div class="audit-chapter-badge">${chapter.label}</div>
              <p style="color:#5F6470;font-size:0.95rem;line-height:1.6;max-width:560px;margin:12px auto 0;">${chapter.description}</p>
            </div>

            <!-- Wheel -->
            <div class="audit-wheel-container">
              <span class="label-pill" style="display:inline-block;margin-bottom:8px;">THE LIFE AUDIT</span>
              <p class="audit-scale-hint" style="font-size:0.85rem;color:#5F6470;margin-bottom:4px;">Your answers have created a picture of how life feels for you right now.</p>
              <p class="audit-scale-hint" style="font-size:0.8rem;color:#C98A4A;margin-bottom:20px;">1 = Needs attention &nbsp;&middot;&nbsp; 10 = Feels deeply satisfying</p>
              <div id="audit-wheel-wrapper" class="audit-wheel-wrapper" style="max-width:560px;margin:0 auto;"></div>
              <p class="audit-disclaimer" style="margin-top:16px;font-size:0.85rem;color:#5F6470;font-style:italic;font-family:'Playfair Display',serif;">This is where you are right now, not who you are.</p>
            </div>

            <!-- Detail cards -->
            <div class="audit-results-details">
              <div class="audit-detail-card">
                <h4>Strongest Area</h4>
                <div class="audit-detail-value">${catLabel(r.strongest.category)}</div>
                <div class="audit-detail-score">${r.strongest.score.score.toFixed(1)} / 10</div>
              </div>
              <div class="audit-detail-card">
                <h4>Area to Explore</h4>
                <div class="audit-detail-value">${catLabel(r.weakest.category)}</div>
                <div class="audit-detail-score">${r.weakest.score.score.toFixed(1)} / 10</div>
              </div>
            </div>

            <!-- Priority areas -->
            ${state.priorityAreas.length > 0 ? `
              <div class="audit-detail-card" style="margin-bottom:32px;">
                <h4>Your Priority Areas</h4>
                <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                  ${state.priorityAreas.map(a => `<span style="background:rgba(233,95,69,0.1);color:#E95F45;padding:6px 14px;border-radius:16px;font-size:0.85rem;font-weight:600;">${a}</span>`).join('')}
                </div>
              </div>
            ` : ''}

            <!-- Pattern -->
            ${pattern ? `
              <div class="audit-pattern">
                <h3>${pattern.label}</h3>
                <p>${pattern.interpretation}</p>
              </div>
            ` : ''}

            <!-- Category scores with interpretations -->
            <div class="audit-category-scores">
              <h3>Your Scores by Area</h3>
              ${AUDIT_CONFIG.categories.map(c => {
                const score = r.categoryScores[c.id];
                const isPriority = state.priorityAreas.includes(c.label);
                return `
                  <div class="audit-category-bar">
                    <div class="audit-category-bar-header">
                      <span>${c.label}${isPriority ? ' <span class="audit-priority-tag">Priority</span>' : ''}</span>
                      <span class="audit-cat-score">${score.score.toFixed(1)} / 10</span>
                    </div>
                    <div class="audit-category-bar-track">
                      <div class="audit-category-bar-fill ${getBarClass(score.score)}" style="width:${score.percent}%"></div>
                    </div>
                    <div class="audit-category-interp">${getCategoryInterpretation(c.id, score.score)}</div>
                  </div>
                `;
              }).join('')}
            </div>


            <!-- Workbook CTA -->
            <div class="audit-workbook-cta">
              <h3>${AUDIT_CONFIG.workbookCta.intro}</h3>
              <p>${AUDIT_CONFIG.workbookCta.copy}</p>
              <p style="font-size:0.85rem;color:rgba(255,255,255,0.7);margin-bottom:20px;">
                Recommended exercises: ${getWorkbookRecommendations(
                  state.priorityAreas.length > 0
                    ? state.priorityAreas.map(a => AUDIT_CONFIG.categories.find(c => c.label === a)?.id).filter(Boolean)
                    : [r.weakest.category]
                ).join(', ')}
              </p>
              <a href="${AUDIT_CONFIG.workbookCta.purchaseUrl}" class="btn btn-large" onclick="auditApp.trackWorkbookCta()">${AUDIT_CONFIG.workbookCta.buttonText}</a>
            </div>

            <div class="audit-share">
              <button class="btn btn-secondary" onclick="auditApp.downloadShareCard()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Save Results
              </button>
            </div>

            <!-- Retake -->
            <div class="audit-retake">
              <button class="btn btn-outline" onclick="auditApp.retake()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                Retake the Assessment
              </button>
            </div>
          </div>
        `);

        setTimeout(() => {
          initLifeAuditWheel(catScores);
        }, 100);
      }

      /* ============================
         LIFE AUDIT WHEEL (SVG)
         ============================ */
      function initLifeAuditWheel(scores) {
        const container = document.getElementById('audit-wheel-wrapper');
        if (!container) return;

        const W = 800, H = 800, cx = 400, cy = 400, wheelR = 180, maxScore = 10;

        const categories = [
          { id: 'career', label: 'CAREER', angle: -90, color: '#062B4F', icon: 'briefcase' },
          { id: 'finances', label: 'FINANCES', angle: -45, color: '#E95F45', icon: 'pound' },
          { id: 'health', label: 'HEALTH', angle: 0, color: '#C98A4A', icon: 'heart' },
          { id: 'relationships', label: 'RELATIONSHIPS', angle: 45, color: '#7C8F6E', icon: 'people' },
          { id: 'personal-growth', label: 'PERSONAL\nGROWTH', angle: 90, color: '#062B4F', icon: 'book' },
          { id: 'fun-recreation', label: 'FUN &\nRECREATION', angle: 135, color: '#E95F45', icon: 'sun' },
          { id: 'environment', label: 'ENVIRONMENT', angle: 180, color: '#C98A4A', icon: 'home' },
          { id: 'purpose-fulfilment', label: 'PURPOSE &\nFULFILMENT', angle: -135, color: '#7C8F6E', icon: 'star' },
        ];

        function deg(a) { return a * Math.PI / 180; }
        function pt(angle, r) {
          const a = deg(angle);
          return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
        }

        const icons = {
          briefcase: '<path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round"/>',

        let svg = [];
        svg.push('<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Life Audit Wheel showing scores across 8 life categories" class="life-audit-svg" style="width:100%;height:auto;display:block;">');

        // Background circle for the wheel area
        svg.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + (wheelR + 12) + '" fill="#FAF6EF" stroke="rgba(6,43,79,0.04)" stroke-width="1"/>');

        var ringLevels = [2, 4, 6, 8, 10];
        ringLevels.forEach(function(level) {
          var r = (level / maxScore) * wheelR;

          if (poly) poly.style.opacity = '0';

          glows.forEach(function(g) { g.style.opacity = '0'; });
          var duration = 800, startTime = performance.now();
          function anim(now) {
            var elapsed = now - startTime;
            var progress = Math.min(elapsed / duration, 1);
            var ease = 1 - (1 - progress) * (1 - progress);
            if (poly) poly.style.opacity = String(ease);
            markers.forEach(function(m, i) {

            if (progress < 1) requestAnimationFrame(anim);

        var tooltipState = { catId: null, timer: null };

        function showTooltip(catId, evt) {
          if (tooltipState.catId === catId) return;
          tooltipState.catId = catId;

          var data = getScoreData(catId);
          if (!data) return;

          var catConfig = categories.find(function(c) { return c.id === catId; });
          if (!catConfig) return;

          var existing = document.querySelector('.life-audit-tooltip');

          tip.style.position = 'fixed';

          tip.style.top = '-999px';

          var svgEl = container.querySelector('svg');
          if (svgEl) {
            var svgRect = svgEl.getBoundingClientRect();
            var scaleX = svgRect.width / W;

            var sx = svgRect.left + badgePt.x * scaleX;
            var sy = svgRect.top + badgePt.y * scaleY;
            var tw = tip.offsetWidth;
            var th = tip.offsetHeight;
            var left = sx - tw / 2;
            var top = sy - th - 8;
            if (left + tw > window.innerWidth - 10) left = window.innerWidth - tw - 10;
            if (left < 10) left = 10;
            if (top < 10) top = sy + 10;
            tip.style.left = left + 'px';
            tip.style.top = top + 'px';
          }
        }

          reportHtml += '<div class="detail-grid">';
          reportHtml += '<div class="detail-card"><h4>Strongest Area</h4><div class="value">' + catLabel(r.strongest.category) + '</div><div style="color:#5F6470;font-size:13px;margin-top:4px;">' + r.strongest.score.score.toFixed(1) + ' / 10</div></div>';
          reportHtml += '<div class="detail-card"><h4>Area to Explore</h4><div class="value">' + catLabel(r.weakest.category) + '</div><div style="color:#5F6470;font-size:13px;margin-top:4px;">' + r.weakest.score.score.toFixed(1) + ' / 10</div></div>';
          reportHtml += '</div>';

          if (r.pattern) {
            reportHtml += '<h2 class="section-title">Your Pattern</h2>';
            reportHtml += '<p class="interp"><strong>' + r.pattern.label + '</strong></p>';
            reportHtml += '<p class="interp">' + r.pattern.interpretation + '</p>';
          }

          reportHtml += '<h2 class="section-title">Your Chapter</h2>';
          reportHtml += '<p class="interp"><strong>' + r.chapter.label + '</strong></p>';
          reportHtml += '<p class="interp">' + r.chapter.description + '</p>';

          reportHtml += '<div class="footer">next-chapter-studio.com &mdash; Design Your Next Chapter</div>';
          reportHtml += '</body></html>';

          var win = window.open('', '_blank');
          if (!win) {
            alert('Please allow popups to download your report.');
            return;
          }
          win.document.write(reportHtml);
          win.document.close();

          setTimeout(function() {
            win.focus();
            win.print();
          }, 500);

          trackEvent(AUDIT_CONFIG.analyticsEvents.resultsDownloaded);
        },

        retake: function () {
          trackEvent(AUDIT_CONFIG.analyticsEvents.retaken);
          resetState();
          initQuestionOrder();
          renderLanding();
          scrollToTop();
        },
      };

      /* ============================
         INIT
         ============================ */
      loadState();
      initQuestionOrder();

      // Save progress on page unload
      window.addEventListener('beforeunload', function () {
        if (state.sessionId && state.lastQuestionIndex > 0) {
          var body = JSON.stringify({ sessionId: state.sessionId, lastQuestionIndex: state.lastQuestionIndex });
          navigator.sendBeacon('/api/audit/progress', body);
        }
      });

      if (state.step === 'questions' || state.step === 'results') {
        const answers = Object.values(state.answers).filter(v => v !== undefined);
        if (state.step === 'results' && state.results) {
          renderResults();
        } else if (answers.length > 0) {
          renderQuestion();
        } else {
          renderLanding();
        }
      } else {
        renderLanding();
      }

    })();
  </script>

</body>
</html>
